<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0e1014;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}button,input{font:inherit}button{border:0}.hidden{display:none!important}.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:100px}.top{position:sticky;top:0;z-index:10;height:62px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:rgba(14,16,20,.92);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800}.vkmark{width:34px;height:34px;border-radius:11px;background:#447bff;color:#fff;display:grid;place-items:center;font-weight:900}.content{padding:0 14px}.page{display:none}.page.active{display:block}.login{min-height:100vh;padding:30px 16px;display:grid;place-items:center;background:#0e1014}.login-card{width:min(430px,100%);background:#181b21;border-radius:26px;padding:30px 22px;text-align:center}.login-logo{width:76px;height:76px;border-radius:24px;background:#447bff;display:grid;place-items:center;margin:0 auto 18px;font-size:35px;font-weight:900}.login h1{margin:0 0 8px}.login p{color:#9aa2ad;line-height:1.45}.login-btn,.primary{background:#447bff;color:#fff;border-radius:14px;padding:13px 16px;font-weight:750}.login-btn{width:100%;margin-top:12px;font-size:16px}.status{min-height:20px;margin-top:12px;color:#9aa2ad;font-size:13px}.profile-card,.card,.post,.friend,.dialog,.track,.searchbox{background:#181b21;border-radius:20px}.profile-card{display:flex;align-items:center;gap:14px;padding:16px;margin:16px 0}.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#dce5ff}.name{font-size:20px;font-weight:800}.muted{color:#9aa2ad}.searchbox{display:flex;gap:8px;padding:8px;margin:14px 0}.searchbox input{min-width:0;flex:1;background:#22262e;color:#fff;border:0;border-radius:13px;padding:12px;outline:0}.title{font-size:27px;font-weight:850;margin:24px 4px 13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.secondary{background:#252a33;color:#fff;border-radius:12px;padding:10px 13px;font-weight:650}.stories{display:flex;gap:13px;overflow:auto;padding:2px 2px 8px}.story{min-width:72px;text-align:center}.story-avatar{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,#6588ff,#a1b6ff);display:grid;place-items:center;font-size:23px;font-weight:800}.story-name{font-size:12px;color:#aeb4bd;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:grid;gap:10px}.friend,.dialog,.track{display:flex;align-items:center;gap:12px;padding:13px}.small-avatar,.cover{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#dce5ff;flex:none}.cover{border-radius:13px}.post{overflow:hidden;margin-bottom:12px}.posthead{display:flex;gap:10px;padding:14px}.postava{width:42px;height:42px;border-radius:50%;background:#dce5ff;color:#447bff;display:grid;place-items:center;font-weight:800}.postbody{padding:0 14px 14px;line-height:1.48;white-space:pre-wrap}.postimg{width:100%;max-height:460px;object-fit:cover}.actions{display:flex;border-top:1px solid #292e36}.actions button{flex:1;background:transparent;color:#9aa2ad;padding:11px 3px;font-size:13px}.empty,.loading{padding:24px;text-align:center;color:#9aa2ad;background:#181b21;border-radius:20px}.player{position:fixed;z-index:25;bottom:88px;left:50%;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:#20242c;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 35px #0008}.player button{background:transparent;color:#fff;font-size:21px}.player-main{flex:1;min-width:0}.track-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-sub{font-size:12px;color:#9aa2ad;margin-top:3px}.nav{position:fixed;z-index:30;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 18px));height:70px;border-radius:23px;background:rgba(24,27,33,.96);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;box-shadow:0 8px 35px #0007;backdrop-filter:blur(18px)}.nav button{background:transparent;color:#777;border-radius:17px;font-size:10px;font-weight:700}.nav button.active{background:#e7efff;color:#447bff}.navicon{display:block;font-size:22px;line-height:25px}

.top-actions{display:flex;align-items:center;gap:8px}.iconbtn{width:42px;height:42px;border-radius:13px;background:#252a33;color:#fff;font-size:25px;line-height:1}.profile-btn{width:42px;height:42px;border-radius:50%;padding:0;background:#252a33;overflow:hidden}.top-avatar{width:100%;height:100%;object-fit:cover}.welcome{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 2px 4px}.welcome-name{font-size:25px;font-weight:850;margin-top:3px}.search-panel{margin:10px 0 2px}.search-results{margin-top:10px}.music-link{margin:12px 0}.nav{grid-template-columns:repeat(4,1fr);overflow:hidden}.nav button{min-width:0;flex:1}.navicon{font-size:21px}.page.profile-page{}
</style>
<style>
.nav{overflow-x:auto;justify-content:flex-start;padding-left:8px;padding-right:8px;gap:4px}
.nav button{min-width:88px;flex:0 0 88px;padding-left:6px;padding-right:6px}
.clips-intro{margin-bottom:12px}
.clips-list{display:flex;flex-direction:column;gap:14px}
.clip-card{background:#191c22;border-radius:20px;overflow:hidden}
.clip-thumb{width:100%;aspect-ratio:9/13;object-fit:cover;background:#0b0d10;display:block}
.clip-body{padding:13px 15px}
.clip-title{font-size:17px;font-weight:700;line-height:1.25}
.clip-meta{margin-top:5px;color:#9da4b0;font-size:14px}
.clip-actions{display:flex;gap:8px;margin-top:10px}
.clip-actions a,.clip-actions button{flex:1;text-align:center}
</style></head>
<body>
<section id="login" class="login"><div class="login-card"><div class="login-logo">VK</div><h1>VK Mini Client</h1><p>VK внутри Telegram Mini App.<br>Войдите через VK ID.</p><button id="loginBtn" class="login-btn">Войти через VK ID</button><div id="status" class="status"></div></div></section>
<main id="app" class="app hidden">
<header class="top"><div class="brand"><div class="vkmark">VK</div><span>VK</span></div><div class="top-actions"><button id="searchBtn" class="iconbtn" onclick="openSearch()" aria-label="Поиск">⌕</button><button id="profileBtn" class="profile-btn" onclick="openProfile()" aria-label="Профиль"><img id="topAvatar" class="top-avatar" alt=""></button></div></header>
<div class="content">
<section id="home" class="page active"><div id="searchBox"></div><div class="welcome"><div><div class="muted">Добро пожаловать</div><div id="homeName" class="welcome-name">Пользователь VK</div></div><button class="secondary" onclick="openMusic()">♫ Музыка</button></div><div class="title">Истории</div><div class="stories"><div class="story"><div class="story-avatar">+</div><div class="story-name">Ваша история</div></div><div class="story"><div class="story-avatar">A</div><div class="story-name">Алекс</div></div><div class="story"><div class="story-avatar">M</div><div class="story-name">Мария</div></div><div class="story"><div class="story-avatar">D</div><div class="story-name">Дмитрий</div></div><div class="story"><div class="story-avatar">K</div><div class="story-name">Катя</div></div></div><div class="row"><div class="title">Лента</div><button class="secondary" onclick="loadFeed()">Обновить</button></div><div id="feed"></div></section>
<section id="friends" class="page"><div class="title">Друзья</div><div id="friendsList" class="list"></div></section>
<section id="messages" class="page"><div class="title">Сообщения</div><div id="messagesList" class="list"></div></section>
<section id="music" class="page"><div class="title">Музыка</div><div class="card" style="padding:15px;margin-bottom:12px"><div class="row"><div><b>Моя музыка</b><div class="muted">Треки VK</div></div><button class="primary" onclick="loadMusic()">Загрузить</button></div></div><div id="musicList" class="list"></div></section>
<section id="clips" class="page">
  <div class="row"><div class="title">Клипы</div><button class="secondary" onclick="loadClips()">Обновить</button></div>
  <div class="card clips-intro"><b>VK Клипы</b><div class="muted">Короткие ролики и видео</div></div>
  <div id="clipsList" class="clips-list"></div>
</section><section id="profile" class="page"><div class="row"><div class="title">Профиль</div><button class="secondary" onclick="goHome()">Назад</button></div><div class="profile-card"><img id="profileAvatar" class="avatar"><div><div id="profileName" class="name"></div><div id="profileId" class="muted"></div></div></div><div class="card" style="padding:15px"><div class="row"><b>Аккаунт</b><button class="secondary" onclick="logout()">Выйти</button></div></div></section>
</div>
<div id="player" class="player hidden"><button id="play" onclick="togglePlay()">▶</button><div class="player-main"><div id="ptitle" class="track-title"></div><div id="partist" class="track-sub"></div></div><button onclick="closePlayer()">×</button><audio id="audio"></audio></div>
<nav class="nav"><button class="active" onclick="go('home',this)"><span class="navicon">⌂</span>Главная</button><button onclick="go('friends',this)"><span class="navicon">♧</span>Друзья</button><button onclick="go('messages',this)"><span class="navicon">◉</span>Сообщения</button><button onclick="go('clips',this)"><span class="navicon">▶</span>Клипы</button></nav>
</main>
<script>
const APP_ID="54798745",REDIRECT_URL="https://vk-mini-client.vercel.app/api/auth/vk/callback",$=id=>document.getElementById(id),status=$('status');
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
function rnd(n){const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",v=new Uint8Array(n);crypto.getRandomValues(v);return [...v].map(x=>c[x%c.length]).join('')}
let state=sessionStorage.getItem('vk_state')||rnd(32),verifier=sessionStorage.getItem('vk_code_verifier')||rnd(64);sessionStorage.setItem('vk_state',state);sessionStorage.setItem('vk_code_verifier',verifier);
try{VKIDSDK.Config.init({app:Number(APP_ID),redirectUrl:REDIRECT_URL,state,codeVerifier:verifier,scope:"email phone friends video audio messages wall",mode:VKIDSDK.ConfigAuthMode.Redirect})}catch(e){status.textContent='Ошибка VK ID: '+e.message}
$('loginBtn').onclick=loginVK;
async function loginVK(){try{status.textContent='Открываем VK ID…';await VKIDSDK.Auth.login()}catch(e){status.textContent='Ошибка входа: '+(e.message||e)}}
function access(){return localStorage.getItem('vk_access_token')||''}
function clearSession(){localStorage.removeItem('vk_user');localStorage.removeItem('vk_access_token');sessionStorage.removeItem('vk_access_token')}
let jsonpSeq=0;
function api(method,params={}){
  const token=access();
  if(!token)return Promise.reject(Error('Нет авторизации'));
  return new Promise((resolve,reject)=>{
    const name='__vk_jsonp_'+Date.now()+'_'+(++jsonpSeq);
    const script=document.createElement('script');
    const q=new URLSearchParams({...params,access_token:token,v:'5.199',callback:name});
    let timer=setTimeout(()=>finish(new Error('VK API: тайм-аут запроса')),15000);
    function cleanup(){clearTimeout(timer);delete window[name];script.remove()}
    function finish(err,data){cleanup();err?reject(err):resolve(data)}
    window[name]=(d)=>{
      if(d?.error){
        const e=new Error(d.error.error_msg||('VK API error '+d.error.error_code));
        e.vkCode=Number(d.error.error_code||0); e.vkSubcode=Number(d.error.error_subcode||0);
        finish(e);return;
      }
      finish(null,d?.response);
    };
    script.onerror=()=>finish(new Error('VK API: не удалось загрузить ответ'));
    script.src='https://api.vk.ru/method/'+encodeURIComponent(method)+'?'+q.toString();
    document.head.appendChild(script);
  });
}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showUser(raw){const u=raw?.user||raw||{},name=[u.first_name,u.last_name].filter(Boolean).join(' ')||'Пользователь VK',id=u.user_id||u.id||'',av=u.avatar||u.photo_200||'';$('homeName').textContent=name;$('profileName').textContent=name;$('profileId').textContent=id?'VK ID: '+id:'';if(av){$('topAvatar').src=av;$('profileAvatar').src=av}$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function exchangeAndEnter(code,device){
  // ВАЖНО: обмен code -> access_token выполняется в браузере через VK ID SDK.
  // Так токен и последующие API-вызовы идут с одного клиентского IP.
  const t=await VKIDSDK.Auth.exchangeCode(code,device);
  if(!t?.access_token)throw Error('VK ID не вернул access_token');
  // Не вызываем VKIDSDK.Auth.userInfo(): на iOS/TG WebView этот отдельный
  // запрос может завершаться сетевым Load failed. Профиль берём обычным VK API
  // JSONP-запросом с того же устройства, где получен токен.
  localStorage.setItem('vk_access_token',t.access_token);
  sessionStorage.setItem('vk_access_token',t.access_token);
  const r=await api('users.get',{fields:'photo_200,first_name,last_name'});
  const user=r?.[0];
  if(!user)throw Error('VK не вернул профиль пользователя');
  const u={user,user_id:user.id,first_name:user.first_name,last_name:user.last_name,avatar:user.photo_200};
  localStorage.setItem('vk_user',JSON.stringify(u));
  history.replaceState({},document.title,'/');
  showUser(u);
  status.textContent='';
  loadFeed();loadFriends();loadMessages();loadClips();
}
async function callback(){
  const p=new URLSearchParams(location.search),code=p.get('code'),device=p.get('device_id');
  if(!code||!device)return;
  try{status.textContent='Получаем токен VK ID…';await exchangeAndEnter(code,device)}
  catch(e){clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Ошибка авторизации: '+(e.message||e)}
}
let reauthStarted=false;
function isIpAuthError(e){return Number(e?.vkCode)===5||/another ip address|друг(ой|ого) ip|другой ip/i.test(String(e?.message||''))}
async function requireReauth(){
  if(reauthStarted)return;
  reauthStarted=true;clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Старая сессия VK привязана к другой сети. Войдите заново.';
}
async function validateSession(){
  if(!access())return false;
  try{const r=await api('users.get',{fields:'photo_200,first_name,last_name'});const u=r?.[0];if(u){localStorage.setItem('vk_user',JSON.stringify({user:u,user_id:u.id,first_name:u.first_name,last_name:u.last_name,avatar:u.photo_200}));showUser({user:u,user_id:u.id,first_name:u.first_name,last_name:u.last_name,avatar:u.photo_200});return true}return false}
  catch(e){if(isIpAuthError(e)){await requireReauth();return false}return false}
}
async function restore(){
  const t=access(),u=localStorage.getItem('vk_user');
  if(!t||!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}
  try{showUser(JSON.parse(u));const ok=await validateSession();if(ok){loadFeed();loadFriends();loadMessages();loadClips()}}
  catch(e){clearSession();$('login').classList.remove('hidden');$('app').classList.add('hidden')}
}
async function loadFriends(){const b=$('friendsList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы увидеть друзей.</div>';return}b.innerHTML='<div class="loading">Загрузка друзей…</div>';try{const r=await api('friends.get',{count:100,fields:'photo_200,first_name,last_name,online'}),a=r?.items||[];b.innerHTML=a.length?a.map(f=>`<div class="friend"><img class="small-avatar" src="${esc(f.photo_200||'')}"/><div><b>${esc((f.first_name||'')+' '+(f.last_name||''))}</b><div class="muted">${f.online?'онлайн':'не в сети'}</div></div></div>`).join(''):'<div class="empty">Друзья не найдены.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Не удалось загрузить друзей: '+esc(e.message)+'</div>'}}
let feedProfiles=new Map();
async function loadFeed(){const b=$('feed');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть ленту.</div>';return}b.innerHTML='<div class="loading">Загружаем ленту…</div>';try{const r=await api('newsfeed.get',{filters:'post',count:20,extended:1,fields:'photo_200,first_name,last_name'}),a=r?.items||[];feedProfiles=new Map((r?.profiles||[]).map(x=>[Number(x.id),x]));b.innerHTML=a.length?a.map(renderPost).join(''):'<div class="empty">Лента пуста.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Лента недоступна: '+esc(e.message)+'</div>'}}
function renderPost(p){const text=p.text||'',photo=p.attachments?.find(x=>x.type==='photo')?.photo?.sizes?.slice(-1)[0]?.url||'',date=p.date?new Date(p.date*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'',src=feedProfiles.get(Number(p.source_id))||{},name=[src.first_name,src.last_name].filter(Boolean).join(' ')||'VK',av=src.photo_200||'';return `<article class="post"><div class="posthead">${av?`<img class="postava" style="object-fit:cover" src="${esc(av)}">`:`<div class="postava">VK</div>`}<div><b>${esc(name)}</b><div class="muted">${date}</div></div></div>${text?`<div class="postbody">${esc(text)}</div>`:''}${photo?`<img class="postimg" src="${esc(photo)}">`:''}<div class="actions"><button>♡ ${p.likes?.count||0}</button><button>Комментарии ${p.comments?.count||0}</button><button>↗ ${p.reposts?.count||0}</button></div></article>`}
async function loadMessages(){const b=$('messagesList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть сообщения.</div>';return}b.innerHTML='<div class="loading">Загрузка сообщений…</div>';try{const r=await api('messages.getConversations',{count:30,extended:1,fields:'photo_100,first_name,last_name'}),items=r?.items||[],profiles=r?.profiles||[];b.innerHTML=items.length?items.map(x=>{const id=x.conversation?.peer?.id,pr=profiles.find(p=>p.id===id)||{},name=[pr.first_name,pr.last_name].filter(Boolean).join(' ')||'Диалог',txt=x.last_message?.text||'Без текста';return `<div class="dialog"><img class="small-avatar" src="${esc(pr.photo_100||'')}"><div><b>${esc(name)}</b><div class="muted">${esc(txt.slice(0,100))}</div></div></div>`}).join(''):'<div class="empty">Диалогов нет.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Сообщения недоступны: '+esc(e.message)+'</div>'}}
async function loadClips(){
  const b=$('clipsList');
  if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть клипы.</div>';return}
  b.innerHTML='<div class="loading">Загружаем клипы и видео…</div>';
  try{
    let items=[];
    try{
      const cat=await api('video.getCatalog',{count:16,extended:1});
      const sections=cat?.items||cat?.sections||[];
      for(const s of sections){
        if(Array.isArray(s?.items)) items.push(...s.items);
      }
    }catch(_){}
    if(!items.length){
      const r=await api('video.search',{q:'клипы',count:20,extended:1,sort:2});
      items=r?.items||[];
    }
    items=items.filter(x=>x&&x.type!=='album').slice(0,20);
    if(!items.length){b.innerHTML='<div class="empty">VK не вернул доступные ролики. Попробуйте обновить.</div>';return}
    b.innerHTML=items.map(x=>{
      const oid=x.owner_id||0,id=x.id||0,title=x.title||'Видео VK';
      const thumb=x.photo_800||x.photo_640||x.photo_320||x.photo_130||'';
      const link=x.url||`https://vk.com/video${oid}_${id}`;
      return `<article class="clip-card">
        ${thumb?`<img class="clip-thumb" loading="lazy" src="${esc(thumb)}" alt="">`:`<div class="clip-thumb"></div>`}
        <div class="clip-body">
          <div class="clip-title">${esc(title)}</div>
          <div class="clip-meta">${x.views?esc(String(x.views))+' просмотров':''}${x.duration?' · '+Math.round(x.duration/60)+' мин':''}</div>
          <div class="clip-actions">
            <a class="secondary" href="${esc(link)}" target="_blank" rel="noopener">Смотреть в VK</a>
          </div>
        </div>
      </article>`;
    }).join('');
  }catch(e){
    if(isIpAuthError(e)){await requireReauth();return}
    b.innerHTML='<div class="empty">Клипы недоступны: '+esc(e.message)+'</div>';
  }
}

async function loadMusic(){const b=$('musicList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть музыку.</div>';return}b.innerHTML='<div class="loading">Загрузка музыки…</div>';try{const r=await api('audio.get',{count:50}),a=r?.items||[];b.innerHTML=a.length?a.map(x=>`<div class="track"><div class="cover">♫</div><div style="flex:1;min-width:0"><div class="track-title">${esc(x.title||'Трек')}</div><div class="track-sub">${esc(x.artist||'VK')}</div></div><button class="primary" onclick='playTrack(${JSON.stringify(x.url||'')},${JSON.stringify(x.title||'Трек')},${JSON.stringify(x.artist||'')})'>▶</button></div>`).join(''):'<div class="empty">VK не вернул список музыки. Для некоторых приложений audio API ограничен.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Музыка недоступна для этого токена: '+esc(e.message)+'</div>'}}
function playTrack(url,title,artist){if(!url){alert('У VK нет URL этого трека для воспроизведения.');return}const a=$('audio');a.src=url;$('ptitle').textContent=title;$('partist').textContent=artist;$('player').classList.remove('hidden');a.play().then(()=>$('play').textContent='❚❚').catch(()=>{})}function togglePlay(){const a=$('audio');if(a.paused){a.play();$('play').textContent='❚❚'}else{a.pause();$('play').textContent='▶'}}function closePlayer(){const a=$('audio');a.pause();a.src='';$('player').classList.add('hidden')}
function go(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='friends')loadFriends();if(id==='messages')loadMessages();if(id==='clips')loadClips();if(id==='music')loadMusic();scrollTo(0,0)}
function goHome(){const b=document.querySelector('.nav button');go('home',b)}
function openProfile(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('profile').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));scrollTo(0,0)}
function openMusic(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('music').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));loadMusic();scrollTo(0,0)}
function openSearch(){const b=$('searchBox');if(b.innerHTML){b.innerHTML='';return}b.innerHTML='<div class="searchbox search-panel"><input id="q" autocomplete="off" placeholder="Найти людей VK"><button class="primary" onclick="searchPeople()">Найти</button></div><div id="searchResults" class="search-results"></div>';$('q').focus()}
async function searchPeople(){const q=$('q')?.value.trim(),b=$('searchResults');if(!q){b.innerHTML='<div class="empty">Введите имя или фамилию.</div>';return}b.innerHTML='<div class="loading">Поиск…</div>';try{const r=await api('users.search',{q,count:30,fields:'photo_200,first_name,last_name,online'}),a=r?.items||[];b.innerHTML=a.length?'<div class="list">'+a.map(u=>`<div class="friend"><img class="small-avatar" src="${esc(u.photo_200||'')}"><div><b>${esc((u.first_name||'')+' '+(u.last_name||''))}</b><div class="muted">ID ${u.id} · ${u.online?'онлайн':'не в сети'}</div></div></div>`).join('')+'</div>':'<div class="empty">Ничего не найдено.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Ошибка поиска: '+esc(e.message)+'</div>'}}
function logout(){clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Вы вышли из аккаунта.';scrollTo(0,0)}
restore();callback();
</script>
</body></html>
