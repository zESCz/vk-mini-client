<script>
'use strict';

function rnd(n){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~',v=new Uint8Array(n);crypto.getRandomValues(v);return [...v].map(x=>c[x%c.length]).join('')}

function access(){return localStorage.getItem('vk_access_token')||''}

let jsonpSeq=0;
// VK API вызывается из браузера: пользовательский access_token может быть привязан к IP клиента.
// Серверный proxy меняет исходящий IP и вызывает VK API error 5 / subcode 1130.
function api(method,params={}) {
  const token=access();
  if(!token) return Promise.reject(Error('Нет авторизации'));

    const name='__vk_jsonp_'+Date.now()+'_'+(++jsonpSeq);

      try { delete window[name]; } catch(_) { window[name]=undefined; }
      script.remove();
    }
    function finish(err,data){
      if(done) return;
      done=true;
      cleanup();

        e.vkSubcode=subcode;
        finish(e);

async function exchangeAndEnter(code,device){const cv=sessionStorage.getItem('vk_code_verifier')||localStorage.getItem('vk_code_verifier')||'';if(!cv)throw Error('Не найден PKCE code_verifier');const t=await VKIDSDK.Auth.exchangeCode(code,device,cv);if(!t?.access_token)throw Error('VK ID не вернул access_token');localStorage.setItem('vk_access_token',t.access_token);sessionStorage.setItem('vk_access_token',t.access_token);const r=await api('users.get',{fields:'photo_200,first_name,last_name'}),u=r?.[0];if(!u)throw Error('VK не вернул профиль пользователя');const saved={user:u,user_id:u.id,first_name:u.first_name,last_name:u.last_name,avatar:u.photo_200};localStorage.setItem('vk_user',JSON.stringify(saved));history.replaceState({},document.title,'/');showUser(saved);status.textContent='';loadFeed();loadFriends();loadMessages();loadClips()}

 const b=$('feed');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть ленту.</div>';return}

 if(uid&&Number(e?.vkCode)===15){try{const r=await api('wall.get',{owner_id:uid,count:20,filter:'owner'}),items=r?.items||[];feedProfiles=new Map();feedProfiles=new Map([[uid,{first_name:u.first_name||saved.first_name,last_name:u.last_name||saved.last_name,photo_200:u.photo_200||saved.avatar}]]);b.innerHTML='<div class="empty" style="text-align:left;padding:14px;margin-bottom:12px">VK ограничил newsfeed.get для этой авторизации. Ниже показаны записи вашей страницы — это временная замена, не полная лента друзей.</div>'+(items.length?items.map(p=>renderPost({...p,source_id:uid})).join(''):'<div class="empty">VK не вернул записи вашей страницы.</div>');return}catch(fe){b.innerHTML='<div class="empty">Лента друзей недоступна: '+esc(e.message)+'<br><br>Не удалось загрузить и записи вашей страницы: '+esc(fe.message)+'</div>';return}}
 b.innerHTML='<div class="empty">Лента недоступна: '+esc(e.message)+'</div>'}

function renderPost(p){
 const text=p.text||'',date=p.date?new Date(p.date*1000).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'',src=feedProfiles.get(Math.abs(Number(p.source_id||p.owner_id||0)))||{},name=[src.first_name,src.last_name].filter(Boolean).join(' ')||'VK',av=src.photo_200||'';
 const attachments=(p.attachments||[]).map(a=>{if(a.type==='photo'){const ph=a.photo||{},sizes=ph.sizes||[],im=sizes.slice().sort((x,y)=>(x.width||0)-(y.width||0)).slice(-1)[0]?.url||ph.photo_1280||ph.photo_807||ph.photo_604||ph.photo_130||'';return im?'<img loading="lazy" src="'+esc(im)+'" alt="Фото к записи">':''}if(a.type==='video'){const v=a.video||{},thumb=v.photo_800||v.photo_640||v.photo_320||v.photo_130||'';return '<div class="wall-video">'+(thumb?'<img loading="lazy" src="'+esc(thumb)+'" alt="Видео" style="width:100%;max-height:320px;object-fit:cover;border-radius:8px">':'')+'<div style="margin-top:8px"><b>'+esc(v.title||'Видео VK')+'</b><div><a href="https://vk.com/video'+Number(v.owner_id||0)+'_'+Number(v.id||0)+'" target="_blank" rel="noopener">Открыть видео</a></div></div></div>'}return ''}).join('');

 return '<article class="post"><div class="posthead">'+(av?'<img class="postava" src="'+esc(av)+'" alt="">':'<div class="postava">VK</div>')+'<div><b>'+esc(name)+'</b><div class="muted">'+date+'</div></div></div>'+(text?'<div class="postbody">'+esc(text)+'</div>':'')+(copyText?'<div class="postbody" style="border-left:2px solid #447bff;margin:0 14px 12px;padding:8px 12px">'+esc(copyText)+'</div>':'')+(attachments?'<div class="wall-attachments">'+attachments+'</div>':'')+'<div class="actions"><span>♡ '+(p.likes?.count||0)+'</span><span>Комментарии '+(p.comments?.count||0)+'</span><span>↗ '+(p.reposts?.count||0)+'</span></div></article>'

async function loadMessages(){const b=$('messagesList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть сообщения.</div>';return}b.innerHTML='<div class="loading">Проверяем доступ к сообщениям VK…</div>';try{const r=await api('messages.getConversations',{count:30,filter:'all',extended:1});const items=r?.items||[];b.innerHTML=items.length?items.map(c=>{const p=c.conversation?.peer||{},m=c.last_message||{},u=(r.profiles||[]).concat(r.groups||[]).find(x=>Number(x.id)===Math.abs(Number(p.id)));const title=u?([u.first_name,u.last_name].filter(Boolean).join(' ')||u.name):('Диалог '+(p.id||''));return `<button class="dialog" style="width:100%;text-align:left;color:inherit" onclick="openDialog(${Number(p.id)||0})"><div class="small-avatar" style="display:grid;place-items:center">◉</div><div style="min-width:0"><b>${esc(title)}</b><div class="muted">${esc(m.text||'Вложение или сообщение')}</div></div></button>`}).join(''):'<div class="empty">Список диалогов пуст.</div>'}catch(e){b.innerHTML='<div class="empty">VK не разрешил загрузить сообщения: '+esc(e.message)+'. Для этой авторизации VK не предоставил нужный доступ.<div style="margin-top:12px"><a class="primary" style="display:inline-block;text-decoration:none" href="https://vk.com/im" target="_blank" rel="noopener">Открыть сообщения VK</a></div></div>'}}

async function loadClips(){
 const b=$('clipsList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть клипы.</div>';return}b.innerHTML='<div class="loading">Загружаем клипы…</div>';

function playClip(index){const item=window.clipItems?.[index];if(!item)return;const previous=document.querySelector('.clip-player-slot:not(.hidden)');if(previous){previous.innerHTML='';previous.classList.add('hidden');const pc=previous.closest('[data-clip-card]');pc?.querySelector('.clip-thumb')?.classList.remove('hidden');pc?.querySelector('[data-play-clip]')?.removeAttribute('disabled')}const card=document.querySelector('[data-clip-card="'+index+'"]'),slot=$('clip-player-'+index),thumb=card?.querySelector('.clip-thumb');if(!slot||!card)return;const oid=Number(item.owner_id||item.owner?.id||0),id=Number(item.id||item.video_id||0);if(!oid||!id){alert('VK не вернул идентификатор видео.');return}let src=item.player||'';try{if(src){const u=new URL(src,location.origin);if(!/(^|\.)vk\.(com|ru)$/.test(u.hostname)&&!/(^|\.)vkvideo\.ru$/.test(u.hostname))throw Error('invalid player host');src=u.href}else src='https://vk.com/video_ext.php?oid='+encodeURIComponent(oid)+'&id='+encodeURIComponent(id)}catch(_){src='https://vk.com/video_ext.php?oid='+encodeURIComponent(oid)+'&id='+encodeURIComponent(id)}if(thumb)thumb.classList.add('hidden');slot.classList.remove('hidden');slot.innerHTML='<iframe title="VK клип" src="'+esc(src)+'" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="eager"></iframe>';card.querySelector('[data-play-clip]')?.setAttribute('disabled','disabled');card.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-play-clip]');if(!btn)return;event.preventDefault();playClip(Number(btn.dataset.clipIndex))},true);
async function loadMusic(){const b=$('musicList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть музыку.</div>';return}b.innerHTML='<div class="loading">Проверяем доступ к музыкальному каталогу VK…</div>';try{const r=await api('audio.get',{count:50}),a=r?.items||[];b.innerHTML=a.length?a.map((x,i)=>`<div class="track"><div class="cover">♫</div><div style="flex:1;min-width:0"><div class="track-title">${esc(x.title||'Трек')}</div><div class="track-sub">${esc(x.artist||'VK')}</div></div><button class="primary" onclick="playTrack(${i})">▶</button></div>`).join(''):'<div class="empty">VK не вернул список музыки.</div>';window.musicTracks=a}catch(e){if(isIpAuthError(e)){await requireReauth();return}if(Number(e?.vkCode)===3){b.innerHTML='<div class="empty"><b>Музыкальный каталог недоступен через публичный VK API.</b><p>Метод audio.get возвращает «Unknown method» (код 3), поэтому Mini App не может получить список треков этим способом. Неофициальное извлечение аудио использовать не будем.</p><a class="secondary" style="display:inline-block;text-decoration:none;margin-top:8px" href="https://vk.com/audio" target="_blank" rel="noopener">Открыть VK Музыку</a></div>';return}b.innerHTML='<div class="empty">Музыка недоступна: '+esc(e.message)+'</div>'}}
function playTrack(i){const x=window.musicTracks?.[i];if(!x?.url){alert('У VK нет URL этого трека для воспроизведения.');return}const a=$('audio');a.src=x.url;$('ptitle').textContent=x.title||'Трек';$('partist').textContent=x.artist||'VK';$('player').classList.remove('hidden');a.play().then(()=>$('play').textContent='❚❚').catch(()=>{})}function togglePlay(){const a=$('audio');if(a.paused){a.play();$('play').textContent='❚❚'}else{a.pause();$('play').textContent='▶'}}function closePlayer(){const a=$('audio');a.pause();a.src='';$('player').classList.add('hidden')}
async function openUserProfile(id){if(!id)return;const actions=$('profileActions'),details=$('profileDetails');$('profileSummary').innerHTML='';$('profileName').textContent='Загрузка профиля…';$('profileId').textContent='VK ID: '+id;$('profileStatus').textContent='';actions.innerHTML='';details.innerHTML='';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('profile').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));try{const r=await api('users.get',{user_ids:id,fields:'photo_200,photo_max_orig,online,city,country,bdate,status,domain,education,relation,sex,counters,about,activities,interests,books,movies,music,site'}),u=r?.[0];if(!u)throw Error('VK не вернул профиль');renderProfileSummary(u,false);feedProfiles.set(Number(u.id),u);actions.innerHTML='<button class="primary" type="button" onclick="openDialog('+Number(u.id)+')">Написать сообщение</button>'+(u.domain?'<div class="muted" style="margin-top:10px">vk.com/'+esc(u.domain)+'</div>':'');details.innerHTML=profileSectionButtons(Number(u.id));loadProfileSection(Number(u.id),'wall')}catch(e){$('profileStatus').textContent='Не удалось загрузить профиль: '+e.message;actions.innerHTML='<button class="secondary" onclick="go(\'friends\',document.querySelectorAll(\'.nav button\')[1])">Назад к друзьям</button>'}scrollTo(0,0)}

function openSearch(){const b=$('searchBox');if(b.innerHTML){b.innerHTML='';return}b.innerHTML='<div class="searchbox"><input id="q" autocomplete="off" placeholder="Найти людей VK"><button class="primary" onclick="searchPeople()">Найти</button></div><div id="searchResults"></div>';$('q').focus()}
