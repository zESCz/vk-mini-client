*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0e1014;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:100px}.top{position:sticky;top:0;z-index:10;height:62px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#0e1014ed;backdrop-filter:blur(18px)}.brand,.top-actions,.row,.welcome{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{justify-content:flex-start;font-size:21px;font-weight:800}.vkmark{width:34px;height:34px;border-radius:11px;background:#447bff;display:grid;place-items:center;font-weight:900}.content{padding:0 14px}.page{display:none}.page.active{display:block}.login{min-height:100vh;padding:30px 16px;display:grid;place-items:center}.login-card{width:min(430px,100%);background:#181b21;border-radius:26px;padding:30px 22px;text-align:center}.login-logo{width:76px;height:76px;border-radius:24px;background:#447bff;display:grid;place-items:center;margin:0 auto 18px;font-size:35px;font-weight:900}.login p,.muted,.status{color:#9aa2ad}.login p{line-height:1.45}.login-btn,.primary{background:#447bff;color:#fff;border-radius:14px;padding:13px 16px;font-weight:750}.login-btn{width:100%;margin-top:12px}.status{font-size:13px;margin-top:12px;overflow-wrap:anywhere;min-height:20px}.iconbtn,.secondary{background:#252a33;color:#fff;border-radius:12px;padding:10px 13px}.iconbtn{font-size:24px}.profile-btn{width:42px;height:42px;border-radius:50%;padding:0;background:#252a33;overflow:hidden}.top-avatar{width:100%;height:100%;object-fit:cover}.title{font-size:27px;font-weight:850;margin:24px 4px 13px}.welcome{padding:18px 2px 4px}.welcome-name{font-size:25px;font-weight:850;margin-top:3px}.stories{display:flex;gap:13px;overflow:auto}.story{min-width:72px;text-align:center}.story-avatar{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,#6588ff,#a1b6ff);display:grid;place-items:center;font-size:23px;font-weight:800}.story-name{font-size:12px;color:#aeb4bd;margin-top:6px}.list{display:grid;gap:10px}.card,.profile-card,.post,.friend,.dialog,.track,.searchbox,.empty,.loading,.clip-card{background:#181b21;border-radius:20px}.profile-card,.friend,.dialog,.track{display:flex;align-items:center;gap:12px;padding:13px}.profile-card{margin:16px 0;padding:16px}.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#dce5ff}.small-avatar,.postava{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#dce5ff;flex:none}.name{font-size:20px;font-weight:800}.empty,.loading{padding:24px;text-align:center;color:#9aa2ad;overflow-wrap:anywhere}.post{overflow:hidden;margin-bottom:12px}.posthead{display:flex;gap:10px;padding:14px}.postbody{padding:0 14px 14px;line-height:1.48;white-space:pre-wrap}.postimg{width:100%;max-height:460px;object-fit:cover}.actions{display:flex;border-top:1px solid #292e36}.actions button{flex:1;background:transparent;color:#9aa2ad;padding:11px 3px;font-size:13px}.searchbox{display:flex;gap:8px;padding:8px;margin:14px 0}.searchbox input{min-width:0;flex:1;background:#22262e;color:#fff;border:0;border-radius:13px;padding:12px}.player{position:fixed;z-index:25;bottom:88px;left:50%;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:#20242c;border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px}.player button{background:transparent;color:#fff;font-size:21px}.player-main{flex:1;min-width:0}.track-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-sub{font-size:12px;color:#9aa2ad}.cover{width:52px;height:52px;border-radius:13px;background:#252a33;display:grid;place-items:center}.nav{position:fixed;z-index:30;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 18px));height:70px;border-radius:23px;background:#181b21f5;display:flex;gap:4px;padding:5px 8px;overflow-x:auto}.nav button{min-width:88px;flex:0 0 88px;background:transparent;color:#777;border-radius:17px;font-size:10px;font-weight:700}.nav button.active{background:#e7efff;color:#447bff}.navicon{display:block;font-size:21px;line-height:25px}.clips-intro{padding:14px;margin-bottom:12px}.clips-list{display:flex;flex-direction:column;gap:14px}.clip-card{overflow:hidden}.clip-thumb{width:100%;aspect-ratio:9/13;object-fit:cover;background:#0b0d10;display:block}.clip-body{padding:13px 15px}.clip-title{font-size:17px;font-weight:700}.clip-meta{margin-top:5px;color:#9da4b0;font-size:14px}.clip-actions{margin-top:10px}.clip-actions a{display:block;text-align:center;text-decoration:none}

<section id="login" class="login"><div class="login-card"><div class="login-logo">VK</div><h1>VK Mini Client</h1><p>VK внутри Telegram Mini App.<br>Войдите через VK ID.</p><button id="loginBtn" class="login-btn">Войти через VK ID</button><div id="status" class="status"></div></div></section>
<main id="app" class="app hidden"><header class="top"><div class="brand"><div class="vkmark">VK</div><span>VK</span></div><div class="top-actions"><button class="iconbtn" onclick="openSearch()" aria-label="Поиск">⌕</button><button class="profile-btn" onclick="openProfile()"><img id="topAvatar" class="top-avatar" alt=""></button></div></header><div class="content">
<section id="home" class="page active"><div id="searchBox"></div><div class="welcome"><div><div class="muted">Добро пожаловать</div><div id="homeName" class="welcome-name">Пользователь VK</div></div><button class="secondary" onclick="openMusic()">♫ Музыка</button></div><div class="title">Истории</div><div class="stories"><div class="story"><div class="story-avatar">+</div><div class="story-name">Ваша история</div></div><div class="story"><div class="story-avatar">A</div><div class="story-name">Алекс</div></div><div class="story"><div class="story-avatar">M</div><div class="story-name">Мария</div></div><div class="story"><div class="story-avatar">D</div><div class="story-name">Дмитрий</div></div></div><div class="row"><div class="title">Лента</div><button class="secondary" onclick="loadFeed()">Обновить</button></div><div id="feed"></div></section>
<section id="friends" class="page"><div class="title">Друзья</div><div id="friendsList" class="list"></div></section><section id="messages" class="page"><div class="title">Сообщения</div><div id="messagesList" class="list"></div></section><section id="music" class="page"><div class="title">Музыка</div><div class="card" style="padding:15px;margin-bottom:12px"><div class="row"><div><b>Моя музыка</b><div class="muted">Треки VK</div></div><button class="primary" onclick="loadMusic()">Загрузить</button></div></div><div id="musicList" class="list"></div></section>
<section id="clips" class="page"><div class="row"><div class="title">Клипы</div><button class="secondary" onclick="loadClips()">Обновить</button></div><div class="card clips-intro"><b>VK Клипы</b><div class="muted">Короткие ролики и видео</div></div><div id="clipsList" class="clips-list"></div></section><section id="profile" class="page"><div class="row"><div class="title">Профиль</div><button class="secondary" onclick="goHome()">Назад</button></div><div class="profile-card"><img id="profileAvatar" class="avatar" alt=""><div><div id="profileName" class="name"></div><div id="profileId" class="muted"></div><div id="profileStatus" class="muted"></div></div></div><div id="profileActions" class="card" style="padding:15px;margin-bottom:12px"></div><div id="profileSummary"></div><div id="profileDetails" class="list"></div><div class="card" style="padding:15px;margin-top:12px"><div class="row"><b>Мой аккаунт</b><button class="secondary" onclick="logout()">Выйти</button></div></div></section></div>
<div id="player" class="player hidden"><button id="play" onclick="togglePlay()">▶</button><div class="player-main"><div id="ptitle" class="track-title"></div><div id="partist" class="track-sub"></div></div><button onclick="closePlayer()">×</button><audio id="audio"></audio></div><nav class="nav"><button class="active" onclick="go('home',this)"><span class="navicon">⌂</span>Главная</button><button onclick="go('friends',this)"><span class="navicon">♧</span>Друзья</button><button onclick="go('messages',this)"><span class="navicon">◉</span>Сообщения</button><button onclick="go('clips',this)"><span class="navicon">▶</span>Клипы</button></nav></main>
<script>
'use strict';
const APP_ID='54798745',REDIRECT_URL=window.location.origin+'/api/auth/vk/callback',$=id=>document.getElementById(id),status=$('status');
// Запрашиваем необходимые права, но не messages: поддержка VK подтвердила, что этот доступ не предоставляется.
const VK_SCOPE='email phone friends video audio photos wall';
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
function rnd(n){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~',v=new Uint8Array(n);crypto.getRandomValues(v);return [...v].map(x=>c[x%c.length]).join('')}
let state=sessionStorage.getItem('vk_state')||localStorage.getItem('vk_state')||rnd(32),verifier=sessionStorage.getItem('vk_code_verifier')||localStorage.getItem('vk_code_verifier')||rnd(64);sessionStorage.setItem('vk_state',state);sessionStorage.setItem('vk_code_verifier',verifier);localStorage.setItem('vk_state',state);localStorage.setItem('vk_code_verifier',verifier);
try{VKIDSDK.Config.init({app:Number(APP_ID),redirectUrl:REDIRECT_URL,state,codeVerifier:verifier,scope:VK_SCOPE,mode:VKIDSDK.ConfigAuthMode.Redirect})}catch(e){status.textContent='Ошибка VK ID: '+(e.message||e)}
$('loginBtn').onclick=loginVK;
async function loginVK(){try{status.textContent='Открываем VK ID…';const cv=sessionStorage.getItem('vk_code_verifier')||localStorage.getItem('vk_code_verifier')||rnd(64),st=rnd(32);sessionStorage.setItem('vk_code_verifier',cv);sessionStorage.setItem('vk_state',st);localStorage.setItem('vk_code_verifier',cv);localStorage.setItem('vk_state',st);const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(cv));const challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const q=new URLSearchParams({client_id:APP_ID,response_type:'code',redirect_uri:REDIRECT_URL,scope:VK_SCOPE,state:st,code_challenge:challenge,code_challenge_method:'s256'});location.assign('https://id.vk.ru/authorize?'+q.toString())}catch(e){status.textContent='Ошибка входа: '+(e.message||e)}}
function access(){return localStorage.getItem('vk_access_token')||''}
function clearSession(){localStorage.removeItem('vk_user');localStorage.removeItem('vk_access_token');localStorage.removeItem('vk_state');localStorage.removeItem('vk_code_verifier');sessionStorage.removeItem('vk_access_token');sessionStorage.removeItem('vk_state');sessionStorage.removeItem('vk_code_verifier')}
let jsonpSeq=0;
// VK API вызывается из браузера: пользовательский access_token может быть привязан к IP клиента.
// Серверный proxy меняет исходящий IP и вызывает VK API error 5 / subcode 1130.
function api(method,params={}) {
  const token=access();
  if(!token) return Promise.reject(Error('Нет авторизации'));
  return new Promise((resolve,reject)=>{
    const name='__vk_jsonp_'+Date.now()+'_'+(++jsonpSeq);
    const script=document.createElement('script');
    const q=new URLSearchParams({...params,access_token:token,v:'5.199',callback:name});
    let done=false;
    const timer=setTimeout(()=>finish(Error('VK API: тайм-аут запроса')),15000);
    function cleanup(){
      clearTimeout(timer);
      try { delete window[name]; } catch(_) { window[name]=undefined; }
      script.remove();
    }
    function finish(err,data){
      if(done) return;
      done=true;
      cleanup();
      err?reject(err):resolve(data);
    }
    window[name]=d=>{
      if(d?.error){
        const info=d.error;
        const code=Number(info.error_code||0);
        const subcode=Number(info.error_subcode||0);
        const message=info.error_msg||('VK API error '+code);
        const e=Error((code?'VK API, код '+code+(subcode?', подкод '+subcode:'')+': ':'')+message);
        e.vkCode=code;
        e.vkSubcode=subcode;
        finish(e);
        return;
      }
      if(!d||!Object.prototype.hasOwnProperty.call(d,'response')){
        finish(Error('VK API: получен некорректный ответ'));
        return;
      }
      finish(null,d.response);
    };
    script.onerror=()=>finish(Error('VK API: не удалось загрузить ответ. Проверьте сеть и доступность VK.'));
    script.src='https://api.vk.ru/method/'+encodeURIComponent(method)+'?'+q.toString();
    document.head.appendChild(script);
  });
}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showUser(raw){const u=raw?.user||raw||{},name=[u.first_name,u.last_name].filter(Boolean).join(' ')||'Пользователь VK',id=u.user_id||u.id||'',av=u.avatar||u.photo_200||'';$('homeName').textContent=name;$('profileName').textContent=name;$('profileId').textContent=id?'VK ID: '+id:'';if(av){$('topAvatar').src=av;$('profileAvatar').src=av}$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function exchangeAndEnter(code,device){const cv=sessionStorage.getItem('vk_code_verifier')||localStorage.getItem('vk_code_verifier')||'';if(!cv)throw Error('Не найден PKCE code_verifier');const t=await VKIDSDK.Auth.exchangeCode(code,device,cv);if(!t?.access_token)throw Error('VK ID не вернул access_token');localStorage.setItem('vk_access_token',t.access_token);sessionStorage.setItem('vk_access_token',t.access_token);const r=await api('users.get',{fields:'photo_200,first_name,last_name'}),u=r?.[0];if(!u)throw Error('VK не вернул профиль пользователя');const saved={user:u,user_id:u.id,first_name:u.first_name,last_name:u.last_name,avatar:u.photo_200};localStorage.setItem('vk_user',JSON.stringify(saved));history.replaceState({},document.title,'/');showUser(saved);status.textContent='';loadFeed();loadFriends();loadMessages();loadClips()}
async function callback(){const p=new URLSearchParams(location.search),code=p.get('code'),device=p.get('device_id'),returnedState=p.get('state');if(!code&&!device)return;if(!code||!device){status.textContent='VK ID вернул неполный ответ авторизации. Проверьте callback-маршрут.';return}const expected=sessionStorage.getItem('vk_state')||localStorage.getItem('vk_state')||'';if(!returnedState||!expected||expected!==returnedState){clearSession();status.textContent='Ошибка авторизации: state не совпадает. Повторите вход.';return}try{status.textContent='Получаем токен VK ID…';await exchangeAndEnter(code,device)}catch(e){clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Ошибка авторизации: '+(e.message||e)}}
function isIpAuthError(e){return Number(e?.vkCode)===5||/another ip address|друг(ой|ого) ip|другой ip/i.test(String(e?.message||''))}
async function requireReauth(){clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Сессия VK недействительна для текущей сети. Войдите заново.'}
async function validateSession(){if(!access())return false;try{const r=await api('users.get',{fields:'photo_200,first_name,last_name'}),u=r?.[0];if(!u)return false;const saved={user:u,user_id:u.id,first_name:u.first_name,last_name:u.last_name,avatar:u.photo_200};localStorage.setItem('vk_user',JSON.stringify(saved));showUser(saved);return true}catch(e){if(isIpAuthError(e))await requireReauth();return false}}
async function restore(){const token=access(),saved=localStorage.getItem('vk_user');if(!token||!saved){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{showUser(JSON.parse(saved));const ok=await validateSession();if(ok){loadFeed();loadFriends();loadMessages();loadClips()}else if(access()){clearSession();$('login').classList.remove('hidden');$('app').classList.add('hidden')}}catch(e){clearSession();$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
async function loadFriends(){const b=$('friendsList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы увидеть друзей.</div>';return}b.innerHTML='<div class="loading">Загрузка друзей…</div>';try{const r=await api('friends.get',{count:100,fields:'photo_200,first_name,last_name,online'}),a=r?.items||[];b.innerHTML=a.length?a.map(f=>`<button type="button" class="friend" data-user-id="${Number(f.id)}" style="width:100%;text-align:left;color:inherit"><img class="small-avatar" src="${esc(f.photo_200||'')}" alt=""><div><b>${esc((f.first_name||'')+' '+(f.last_name||''))}</b><div class="muted">${f.online?'онлайн':'не в сети'} · Открыть профиль</div></div></button>`).join(''):'<div class="empty">Друзья не найдены.</div>';/* Обработчик перенесён на document в capture-фазу ниже для надёжной обработки на iOS. */}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Не удалось загрузить друзей: '+esc(e.message)+'</div>'}}
document.addEventListener('click',event=>{const item=event.target.closest('#friendsList [data-user-id]');if(!item)return;event.preventDefault();event.stopPropagation();const id=Number(item.dataset.userId);if(!id)return;openUserProfile(id)},true);
let feedProfiles=new Map();
async function loadFeed(){const b=$('feed');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть ленту.</div>';return}b.innerHTML='<div class="loading">Загружаем ленту…</div>';try{const r=await api('newsfeed.get',{filters:'post',count:20,extended:1,fields:'photo_200,first_name,last_name'}),a=r?.items||[];feedProfiles=new Map((r?.profiles||[]).map(x=>[Number(x.id),x]));b.innerHTML=a.length?a.map(renderPost).join(''):'<div class="empty">Лента пуста.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Лента недоступна: '+esc(e.message)+'</div>'}}
function renderPost(p){const text=p.text||'',photo=p.attachments?.find(x=>x.type==='photo')?.photo?.sizes?.slice(-1)[0]?.url||'',date=p.date?new Date(p.date*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'',src=feedProfiles.get(Number(p.source_id))||{},name=[src.first_name,src.last_name].filter(Boolean).join(' ')||'VK',av=src.photo_200||'';return `<article class="post"><div class="posthead">${av?`<img class="postava" src="${esc(av)}" alt="">`:'<div class="postava">VK</div>'}<div><b>${esc(name)}</b><div class="muted">${date}</div></div></div>${text?`<div class="postbody">${esc(text)}</div>`:''}${photo?`<img class="postimg" src="${esc(photo)}" alt="">`:''}<div class="actions"><button>♡ ${p.likes?.count||0}</button><button>Комментарии ${p.comments?.count||0}</button><button>↗ ${p.reposts?.count||0}</button></div></article>`}
let activePeerId=null;
async function loadMessages(){const b=$('messagesList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть сообщения.</div>';return}b.innerHTML='<div class="loading">Проверяем доступ к сообщениям VK…</div>';try{const r=await api('messages.getConversations',{count:30,filter:'all',extended:1});const items=r?.items||[];b.innerHTML=items.length?items.map(c=>{const p=c.conversation?.peer||{},m=c.last_message||{},u=(r.profiles||[]).concat(r.groups||[]).find(x=>Number(x.id)===Math.abs(Number(p.id)));const title=u?([u.first_name,u.last_name].filter(Boolean).join(' ')||u.name):('Диалог '+(p.id||''));return `<button class="dialog" style="width:100%;text-align:left;color:inherit" onclick="openDialog(${Number(p.id)||0})"><div class="small-avatar" style="display:grid;place-items:center">◉</div><div style="min-width:0"><b>${esc(title)}</b><div class="muted">${esc(m.text||'Вложение или сообщение')}</div></div></button>`}).join(''):'<div class="empty">Список диалогов пуст.</div>'}catch(e){b.innerHTML='<div class="empty">VK не разрешил загрузить сообщения: '+esc(e.message)+'. Если указано отсутствие прав, это ограничение доступа токена VK ID, а не ошибка интерфейса.</div>'}}
async function openDialog(peerId){if(!peerId)return;activePeerId=peerId;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('messages').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button')[2]?.classList.add('active');const b=$('messagesList');b.innerHTML='<div class="loading">Загружаем диалог…</div>';try{const r=await api('messages.getHistory',{peer_id:peerId,count:30});const items=r?.items||[];b.innerHTML='<button class="secondary" onclick="loadMessages()">← Все диалоги</button><div class="list" style="margin-top:12px">'+items.slice().reverse().map(m=>`<div class="dialog"><div style="min-width:0"><div class="muted">${m.from_id===Number(peerId)?'Собеседник':'Вы'}</div><div>${esc(m.text||'Вложение')}</div></div></div>`).join('')+'</div><form onsubmit="sendMessage(event)" class="searchbox"><input id="messageText" placeholder="Сообщение…" autocomplete="off"><button class="primary" type="submit">Отправить</button></form>'}catch(e){b.innerHTML='<div class="empty">Не удалось открыть диалог: '+esc(e.message)+'. Если VK сообщает об отсутствии прав, сообщения нельзя включить одним изменением интерфейса.</div><button class="secondary" onclick="loadMessages()">Назад к диалогам</button>'}}
async function sendMessage(event){event.preventDefault();const input=$('messageText'),message=input?.value.trim();if(!message||!activePeerId)return;try{await api('messages.send',{peer_id:activePeerId,random_id:Math.floor(Math.random()*2147483647),message});await openDialog(activePeerId)}catch(e){alert('VK не разрешил отправить сообщение: '+e.message)}}
async function loadClips(){const b=$('clipsList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть клипы.</div>';return}b.innerHTML='<div class="loading">Загружаем клипы и видео…</div>';try{let items=[];try{const cat=await api('video.getCatalog',{count:16,extended:1});for(const s of (cat?.items||cat?.sections||[]))if(Array.isArray(s?.items))items.push(...s.items)}catch(_){}if(!items.length){const r=await api('video.search',{q:'клипы',count:20,extended:1,sort:2});items=r?.items||[]}items=items.filter(x=>x&&x.type!=='album').slice(0,20);if(!items.length){b.innerHTML='<div class="empty">VK не вернул ролики. Возможно, методы каталога недоступны для этого токена.</div>';return}b.innerHTML=items.map(x=>{const oid=Number(x.owner_id||0),id=Number(x.id||0),title=x.title||'Видео VK',thumb=x.photo_800||x.photo_640||x.photo_320||x.photo_130||'',player=x.player||'',views=x.views||0,duration=x.duration||0;return `<article class="clip-card">${thumb?`<img class="clip-thumb" loading="lazy" src="${esc(thumb)}" alt="">`:'<div class="clip-thumb"></div>'}<div class="clip-body"><div class="clip-title">${esc(title)}</div><div class="clip-meta">${views?esc(String(views))+' просмотров':''}${duration?' · '+Math.round(duration/60)+' мин':''}</div><div class="clip-actions"><button class="primary" type="button" data-play-clip="1" data-owner-id="${oid}" data-video-id="${id}" data-player="${esc(player)}" data-title="${esc(title)}">▶ Смотреть здесь</button></div></div></article>`}).join('')}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Клипы недоступны: '+esc(e.message)+'</div>'}}
function playClip(ownerId,videoId,player,title){const b=$('clipsList'),old=$('clipInlinePlayer');if(old)old.remove();if(!ownerId||!videoId){alert('VK не вернул идентификатор этого видео.');return}let src=player;try{if(src){const u=new URL(src,location.origin);if(!/(^|\\.)vk\\.(com|ru)$/.test(u.hostname)&&!/(^|\\.)vkvideo\\.ru$/.test(u.hostname))throw Error('invalid player host');src=u.href}else src='https://vk.com/video_ext.php?oid='+encodeURIComponent(ownerId)+'&id='+encodeURIComponent(videoId)}catch(_){src='https://vk.com/video_ext.php?oid='+encodeURIComponent(ownerId)+'&id='+encodeURIComponent(videoId)}const box=document.createElement('section');box.id='clipInlinePlayer';box.className='card';box.style.cssText='padding:10px;margin:12px 0 16px';box.innerHTML='<div class="row" style="margin-bottom:8px"><b>'+esc(title||'VK Клипы')+'</b><button class="secondary" type="button" id="closeClipPlayer">Закрыть</button></div><div style="position:relative;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden"><iframe title="VK video player" src="'+esc(src)+'" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="eager"></iframe></div><div class="muted" style="margin-top:8px">Видео воспроизводится во встроенном окне, если VK разрешает встраивание этого ролика.</div>';b.prepend(box);$('closeClipPlayer').onclick=()=>box.remove();box.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-play-clip]');if(!btn)return;event.preventDefault();playClip(Number(btn.dataset.ownerId),Number(btn.dataset.videoId),btn.dataset.player||'',btn.dataset.title||'VK Клипы')},true);
async function loadMusic(){const b=$('musicList');if(!access()){b.innerHTML='<div class="empty">Войдите через VK ID, чтобы открыть музыку.</div>';return}b.innerHTML='<div class="loading">Проверяем доступ к музыкальному каталогу VK…</div>';try{const r=await api('audio.get',{count:50}),a=r?.items||[];b.innerHTML=a.length?a.map((x,i)=>`<div class="track"><div class="cover">♫</div><div style="flex:1;min-width:0"><div class="track-title">${esc(x.title||'Трек')}</div><div class="track-sub">${esc(x.artist||'VK')}</div></div><button class="primary" onclick="playTrack(${i})">▶</button></div>`).join(''):'<div class="empty">VK не вернул список музыки.</div>';window.musicTracks=a}catch(e){if(isIpAuthError(e)){await requireReauth();return}if(Number(e?.vkCode)===3){b.innerHTML='<div class="empty"><b>Музыкальный каталог недоступен через публичный VK API.</b><p>Метод audio.get возвращает «Unknown method» (код 3), поэтому Mini App не может получить список треков этим способом. Неофициальное извлечение аудио использовать не будем.</p><a class="secondary" style="display:inline-block;text-decoration:none;margin-top:8px" href="https://vk.com/audio" target="_blank" rel="noopener">Открыть VK Музыку</a></div>';return}b.innerHTML='<div class="empty">Музыка недоступна: '+esc(e.message)+'</div>'}}
function playTrack(i){const x=window.musicTracks?.[i];if(!x?.url){alert('У VK нет URL этого трека для воспроизведения.');return}const a=$('audio');a.src=x.url;$('ptitle').textContent=x.title||'Трек';$('partist').textContent=x.artist||'VK';$('player').classList.remove('hidden');a.play().then(()=>$('play').textContent='❚❚').catch(()=>{})}function togglePlay(){const a=$('audio');if(a.paused){a.play();$('play').textContent='❚❚'}else{a.pause();$('play').textContent='▶'}}function closePlayer(){const a=$('audio');a.pause();a.src='';$('player').classList.add('hidden')}
async function openUserProfile(id){if(!id)return;const actions=$('profileActions'),details=$('profileDetails');$('profileSummary').innerHTML='';$('profileName').textContent='Загрузка профиля…';$('profileId').textContent='VK ID: '+id;$('profileStatus').textContent='';actions.innerHTML='';details.innerHTML='';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('profile').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));try{const r=await api('users.get',{user_ids:id,fields:'photo_200,photo_max_orig,online,city,country,bdate,status,domain,education,relation,sex,counters,about,activities,interests,books,movies,music,site'}),u=r?.[0];if(!u)throw Error('VK не вернул профиль');renderProfileSummary(u,false);actions.innerHTML='<button class="primary" type="button" onclick="openDialog('+Number(u.id)+')">Написать сообщение</button>'+(u.domain?'<div class="muted" style="margin-top:10px">vk.com/'+esc(u.domain)+'</div>':'');details.innerHTML=profileSectionButtons(Number(u.id));loadProfileSection(Number(u.id),'wall')}catch(e){$('profileStatus').textContent='Не удалось загрузить профиль: '+e.message;actions.innerHTML='<button class="secondary" onclick="go(\'friends\',document.querySelectorAll(\'.nav button\')[1])">Назад к друзьям</button>'}scrollTo(0,0)}
function renderProfileSummary(u,own){const name=[u.first_name,u.last_name].filter(Boolean).join(' ')||'Пользователь VK';$('profileName').textContent=name;$('profileId').textContent=(u.id?'VK ID: '+u.id:'')+(own?' · Мой профиль':'');$('profileStatus').textContent=u.online?'Сейчас онлайн':(u.status||'Профиль VK');const av=u.photo_200||u.photo_max_orig;if(av){$('profileAvatar').src=av;$('topAvatar').src=av}const details=$('profileSummary');if(!details)return;const rows=[];if(u.city?.title)rows.push(['Город',u.city.title]);if(u.country?.title)rows.push(['Страна',u.country.title]);if(u.bdate)rows.push(['День рождения',u.bdate]);if(u.status)rows.push(['Статус',u.status]);if(u.about)rows.push(['О себе',u.about]);if(u.activities)rows.push(['Деятельность',u.activities]);if(u.interests)rows.push(['Интересы',u.interests]);if(u.education?.university_name)rows.push(['Образование',u.education.university_name]);if(u.domain)rows.push(['Страница','vk.com/'+u.domain]);if(u.counters){if(u.counters.friends!=null)rows.push(['Друзья',u.counters.friends]);if(u.counters.photos!=null)rows.push(['Фото',u.counters.photos]);if(u.counters.videos!=null)rows.push(['Видео',u.counters.videos]);if(u.counters.audios!=null)rows.push(['Аудиозаписи',u.counters.audios])}details.innerHTML=rows.length?'<div class="card" style="padding:15px"><b>Краткая информация</b>'+rows.map(([k,v])=>'<div class="row" style="padding-top:10px;gap:16px"><span class="muted">'+esc(k)+'</span><span style="text-align:right">'+esc(v)+'</span></div>').join('')+'</div>':'<div class="empty">VK не предоставил дополнительную информацию профиля.</div>'}
function profileSectionButtons(id){return '<div class="card" style="padding:14px"><b>Разделы профиля</b><div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:12px"><button class="secondary" onclick="loadProfileSection('+id+',\'wall\')">Стена</button><button class="secondary" onclick="loadProfileSection('+id+',\'photos\')">Фото</button><button class="secondary" onclick="loadProfileSection('+id+',\'friends\')">Друзья</button><button class="secondary" onclick="loadProfileSection('+id+',\'videos\')">Видео</button><button class="secondary" onclick="loadProfileSection('+id+',\'music\')">Музыка</button></div></div><div id="profileSectionContent" class="list"></div>'}
async function loadProfileSection(id,kind){const out=$('profileSectionContent');if(!out)return;out.innerHTML='<div class="loading">Загружаем раздел…</div>';try{if(kind==='music'){out.innerHTML='<div class="empty">Публичный метод audio.get возвращает «Unknown method» и в этой авторизации не поддерживается. Не буду подменять его неофициальным извлечением аудио.</div>';return}if(kind==='wall'){const r=await api('wall.get',{owner_id:id,count:10,filter:'owner'}),items=r?.items||[];out.innerHTML=items.length?items.slice(1).map(p=>'<article class="post"><div class="postbody">'+esc(p.text||'Запись без текста')+'</div>'+(p.date?'<div class="muted" style="padding:0 14px 12px">'+new Date(p.date*1000).toLocaleDateString('ru-RU')+'</div>':'')+'</article>').join(''):'<div class="empty">Постов не найдено или VK ограничил доступ к стене.</div>';return}if(kind==='photos'){const r=await api('photos.getAll',{owner_id:id,count:20,extended:1,photo_sizes:1}),items=r?.items||[];out.innerHTML=items.length?'<div class="card" style="padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">'+items.map(p=>{const size=p.sizes?.slice(-1)[0]?.url||p.photo_604||p.photo_130||'';return size?'<img loading="lazy" src="'+esc(size)+'" alt="Фото VK" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">':''}).join('')+'</div>':'<div class="empty">Фото не найдены или VK ограничил доступ к альбому.</div>';return}if(kind==='friends'){const r=await api('friends.get',{user_id:id,count:30,fields:'photo_100,first_name,last_name'}),items=r?.items||[];out.innerHTML=items.length?'<div class="list">'+items.map(f=>'<div class="friend">'+(f.photo_100?'<img class="small-avatar" src="'+esc(f.photo_100)+'" alt="">':'')+'<div><b>'+esc((f.first_name||'')+' '+(f.last_name||''))+'</b><div class="muted">VK ID: '+Number(f.id)+'</div></div></div>').join('')+'</div>':'<div class="empty">VK не вернул список друзей или ограничил его просмотр.</div>';return}if(kind==='videos'){const r=await api('video.get',{owner_id:id,count:20}),items=r?.items||[];out.innerHTML=items.length?items.map(v=>'<div class="dialog"><div><b>'+esc(v.title||'Видео VK')+'</b><div class="muted">'+esc(v.description||'')+'</div><a href="https://vk.com/video'+Number(v.owner_id)+'_'+Number(v.id)+'" target="_blank" rel="noopener">Открыть видео</a></div></div>').join(''):'<div class="empty">VK не вернул видео или ограничил доступ.</div>';return}}catch(e){out.innerHTML='<div class="empty">Этот раздел недоступен через текущую авторизацию VK: '+esc(e.message)+'</div>'}}

function go(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='friends')loadFriends();if(id==='messages')loadMessages();if(id==='clips')loadClips();if(id==='music')loadMusic();scrollTo(0,0)}function goHome(){go('home',document.querySelector('.nav button'))}async function openProfile(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('profile').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('profileActions').innerHTML='';$('profileSummary').innerHTML='';$('profileDetails').innerHTML='';try{const saved=JSON.parse(localStorage.getItem('vk_user')||'{}'),u=saved.user||saved,id=u.id||saved.user_id;if(id){const r=await api('users.get',{user_ids:id,fields:'photo_200,photo_max_orig,online,city,country,bdate,status,domain,education,relation,sex,counters,about,activities,interests,books,movies,music,site'});const full=r?.[0]||u;renderProfileSummary({...full,...(full.id?{}:{id})},true);$('profileActions').innerHTML='<div class="muted">Это ваш профиль. Информация показана в пределах прав, предоставленных VK.</div>';return}renderProfileSummary(u,true)}catch(e){const saved=JSON.parse(localStorage.getItem('vk_user')||'{}'),u=saved.user||saved;renderProfileSummary(u,true);$('profileActions').innerHTML='<div class="empty">Дополнительные данные VK не загрузились: '+esc(e.message)+'</div>'}scrollTo(0,0)}function openMusic(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('music').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));loadMusic();scrollTo(0,0)}
function openSearch(){const b=$('searchBox');if(b.innerHTML){b.innerHTML='';return}b.innerHTML='<div class="searchbox"><input id="q" autocomplete="off" placeholder="Найти людей VK"><button class="primary" onclick="searchPeople()">Найти</button></div><div id="searchResults"></div>';$('q').focus()}
async function searchPeople(){const q=$('q')?.value.trim(),b=$('searchResults');if(!q){b.innerHTML='<div class="empty">Введите имя или фамилию.</div>';return}b.innerHTML='<div class="loading">Поиск…</div>';try{const r=await api('users.search',{q,count:30,fields:'photo_200,first_name,last_name,online'}),a=r?.items||[];b.innerHTML=a.length?'<div class="list">'+a.map(u=>`<button class="friend" style="width:100%;text-align:left;color:inherit" onclick="openUserProfile(${Number(u.id)})"><img class="small-avatar" src="${esc(u.photo_200||'')}" alt=""><div><b>${esc((u.first_name||'')+' '+(u.last_name||''))}</b><div class="muted">ID ${u.id} · ${u.online?'онлайн':'не в сети'} · Открыть профиль</div></div></button>`).join('')+'</div>':'<div class="empty">Ничего не найдено.</div>'}catch(e){if(isIpAuthError(e)){await requireReauth();return}b.innerHTML='<div class="empty">Ошибка поиска: '+esc(e.message)+'</div>'}}
function logout(){clearSession();$('app').classList.add('hidden');$('login').classList.remove('hidden');status.textContent='Вы вышли из аккаунта.';scrollTo(0,0)}
restore();callback();
</script></body></html>
